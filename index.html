  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const el=id=>document.getElementById(id);
  async function dec(pw){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c)));
  }
  function msg(t,ok){el('msg').textContent=t;el('msg').style.color=ok?'#ffe680':'#ff6a5a';}
  async function tryPw(pw,save){
    el('go').disabled=true;msg('Kontrol ediliyor...',true);
    try{
      const html=await dec(pw);
      try{if(save)localStorage.setItem('asb_pw',pw);else localStorage.removeItem('asb_pw');}catch(e){}
      document.open();document.write(html);document.close();
      return true;
    }catch(e){
      el('go').disabled=false;
      msg(window.isSecureContext&&window.crypto&&crypto.subtle?'Yanlış şifre amk. Davet edilmediysen siktir git.':'Bu sayfa https ile açılmalı.',false);
      return false;
    }
  }
  el('f').addEventListener('submit',e=>{e.preventDefault();const pw=el('pw').value;if(pw)tryPw(pw,el('rem').checked);});
  let saved=null;try{saved=localStorage.getItem('asb_pw');}catch(e){}
  if(saved)tryPw(saved,true).then(ok=>{if(!ok){try{localStorage.removeItem('asb_pw');}catch(e){}msg('',true);}});
})();
